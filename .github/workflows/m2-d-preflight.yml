name: ArcBox M2-D cloud read-only preflight

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/m2-d-preflight.yml'
      - 'scripts/m2/cloud-preflight.mjs'
      - 'tests/cloud/preflight.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcbox-m2d-readonly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check metadata reader without secrets or dependencies
        run: node --test tests/cloud/preflight.test.mjs
      - name: Explain an unconfigured gate without claiming cloud acceptance
        if: ${{ vars.ARCBOX_M2D_PREFLIGHT_ENABLED != 'true' }}
        run: echo 'M2-D cloud inspection NOT RUN. Configure the protected arcbox_testnet environment before enabling the repository preflight flag. Unit checks are not cloud acceptance.' >> "$GITHUB_STEP_SUMMARY"

  inspect:
    needs: checks
    # The repository flag is set only AFTER the user creates protection rules.
    # Do not implicitly create an unprotected environment or reuse Demo secrets.
    if: ${{ success() && vars.ARCBOX_M2D_PREFLIGHT_ENABLED == 'true' && github.repository == 'iwbinb/ArcBox' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: arcbox_testnet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Confirm this is still the current dev source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
      - name: Read existing account metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/m2/cloud-preflight.mjs
      - name: Preserve sanitized result only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-d-preflight-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: reports/m2-d-preflight.json
